# ========================================
# 挖掘轨迹规划器参数配置
# ========================================

# ---------- 状态空间参数 ----------
# 动臂离散状态数（下降段+上升段总数）
boom_states: 16
# 斗杆耦合增益离散数
arm_gains: 4
# 铲斗耦合增益离散数
bucket_gains: 4
# DP 递推步数
dig_steps: 9

# ---------- 动臂状态生成参数 ----------
# 动臂下降步数
boom_down_steps: 3
# 动臂下降每步角度 (deg)
boom_down_diff: 2.0
# 动臂上升步数
boom_up_steps: 12

# ---------- 代价权重 ----------
# 挖掘量偏差权重（主目标）
w_volume: 1.0
# 飞齿惩罚权重（硬约束，齿尖不得高出地面）
w_ground: 10.0
# 深度约束权重（硬约束，最小挖掘深度）
w_depth: 5.0
# 动臂变化率权重（软约束，限制单步变化幅度）
w_boom_rate: 0.5
# 联动约束权重（硬约束，禁止不合理联动）
w_coupling: 2.0

# ---------- 体积计算参数 ----------
# 挖掘量计算子步数（越大越精确，但计算量增加）
volume_interval: 15

# ---------- 地形参数 ----------
# 地形分辨率 (m)
terrain_resolution: 0.05
# 地形平滑窗口（奇数）
terrain_smooth_window: 7

# ---------- 参考挖掘量 ----------
# 参考挖掘量 (m^2, 2D截面面积)
v_ref: 0.5

# ---------- 约束参数 ----------
# 最小挖掘深度 (m)
min_depth: 0.1
# 动臂单步最大变化 (deg)
max_boom_step: 4.0
# 前N步禁止动臂后退
no_retreat_steps: 2

# ---------- 关节限位 (deg) ----------
joint_limits:
  boom: [-45.44, 55.28]
  arm: [-138.69, -37.35]
  bucket: [-133.48, 30.53]

# ---------- 后处理参数 ----------
postprocess:
  # 插值时间步长 (s)
  dt: 0.1
  # 关节最大角速度 (deg/s)
  max_boom_vel: 30.0
  max_arm_vel: 45.0
  max_bucket_vel: 60.0
  # 是否检查可达性
  check_reachability: true

# ---------- 挖掘机尺寸参数 (m) ----------
robot:
  l_boom: 7.0
  l_arm: 2.6
  l_bucket: 2.06
