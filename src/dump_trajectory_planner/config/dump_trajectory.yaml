# =============================================================
# 卸载轨迹规划节点参数（关节空间版）
# 节点私有命名空间：/dump_trajectory_node/
# =============================================================

# ---- kinematics 运动学参数（由 KinematicsSolver 从 pnh/kinematics/... 加载）----
kinematics:
  # 连杆长度 (m)
  boom_length: 6.987
  arm_length: 2.797
  bucket_tooth_length: 2.359
  # 动臂销轴相对回转中心的偏置 (m)
  boom_pivot_x: 0.09
  boom_pivot_y: 0.03
  boom_pivot_z: 0.0
  # 关节限位 (deg)
  boom_joint_lower: -25.0
  boom_joint_upper:  50.0
  arm_joint_lower:  -150.0
  arm_joint_upper:     -30.0
  bucket_joint_lower: -135.0
  bucket_joint_upper:   30.0

# ---- 可行性检查 ----
feasibility:
  enable_envelope_prefilter: false   # 是否启用 IK 前的包络粗筛
  reach_min: 3.0                    # 水平半径最小值 (m)
  reach_max: 12.0                   # 水平半径最大值 (m)
  dump_height_min: 0.0              # 卸载点最低高度 (m)
  dump_height_max: 5.5              # 卸载点最高高度 (m)
  bucket_attitude_deg: -90.0        # 卸载姿态角 (deg，齿尖朝下)

# ---- 关键航路点生成（简化 4 航路点：WP1, WP4, WP5, WP6）----
waypoint:
  # 姿态角上限：boom+arm+bucket ≥ 该值时用姿态角约束修正 bucket
  attitude_angle_deg: -180.0

  # WP4 铰接点相对卡车表面的高度偏置 (m)
  # 铰接点目标高度 = (truck_center_z - truck_height_offset) + wp4_height_bias
  wp4_height_bias: 1.5

  # 卡车框高度偏移 (m)：卡车框高度 = truck_center_z - truck_height_offset
  truck_height_offset: 0.5

  # WP4 IK 求解的铲斗关节角（deg），bucket_len=0 时不影响 swing/boom/arm
  wp4_bucket_angle_deg: 25.0

  # WP3 swing 最小步长：|median - swing4| ≤ 该值时用 swing4 ± 该值
  wp3_swing_step_deg: 5.0

  # WP2 boom 提升幅度插值参数
  p3_min_z0_swing_deg: 10.0    # swing 差 ≤ 该值 → boom 直接提到 WP4 高度
  p3_max_z0_swing_deg: 60.0    # swing 差 ≥ 该值 → boom 仅做最小提升
  max_boom_lift24_deg: 20.0    # WP2 相对 WP4 的 boom 最大差值

  # WP3 swing 速度插值参数
  p3_min_swing_deg: 15.0
  p3_max_swing_deg: 60.0
  min_p3_swing_vel_dps: 10.0
  max_p3_swing_vel_dps: 15.0

  # WP3 混合系数：值越小 → 越早开始跟随
  p3_boom_cof: 0.5             # boom3 = cof·boom2 + (1-cof)·boom4
  p3_arm_cof: 0.5              # arm3  = cof·arm2  + (1-cof)·arm4

  # WP5 混合系数
  p5_boom_cof: 0.5
  p5_arm_cof: 0.5

  # 段主导关节速度 (deg/s)
  wp2_vel_boom_dps: 10.0
  wp4_vel_swing_dps: 15.0
  wp4_vel_arm_dps: 15.0
  wp5_vel_boom_dps: 8.0
  wp5_vel_arm_dps: 15.0
  wp5_vel_bkt_dps: 50.0

  # 铲斗关节限位 (deg)
  bucket_limit_lower_deg: -170.0
  bucket_limit_upper_deg:   30.0

  # ---- WP4 入厢点（回转圆策略，照 MATLAB calc_entry_point_circle_strategy）----
  truck_box_length: 5.0        # 卡车厢长 L (m)
  truck_box_width:  2.6        # 卡车厢宽 W (m)
  wp4_R_coff:       0.5        # 回转圆半径混合系数：R = coff·R_dig_end + (1-coff)·R_unload

# ---- 逐帧发布频率 (Hz) ----
publish_rate: 10.0

# ---- 可视化（RViz 实机联调）----
visualization:
  enable: true          # 可视化总开关：false 时不发布任何 dump_viz/* 话题
  frame_id: base        # 全部可视化 marker 的坐标系

# ---- 全局执行超时 (s) ----
total_timeout_sec: 30.0

# ---- 在线规划参数（3 段）----
online_plan:
  # 段完成关节角容差（各段独立，deg）
  #   seg0 WP1→WP4：swing + boom + 高度门控
  #   seg1 WP4→WP5：仅检查 swing
  #   seg2 WP5→WP6：arm + bucket（两者均达标才完成）
  seg0_swing_deg: 5.0
  seg0_boom_deg: 5.0
  seg0_height_gate: true   # WP1→WP4 是否同时要求铲斗高度 > truck_top + margin
  seg1_swing_deg: 5.0
  seg2_arm_deg: 10.0
  seg2_bucket_deg: 20.0

  # 段完成需连续确认帧数（防液压振荡误判）
  segment_confirm_frames: 3

  # Seg0(WP1→WP4) 专用确认帧数：boom 阶跃后臂架存在 0.5~2Hz 液压振荡模态，
  # 需更长确认窗（默认 8 帧=0.8s @10Hz）防止振荡中途误判达标 / 高度门控被瞬时值抖过
  seg0_confirm_frames: 8

  # 段超时倍率：实际耗时 > 预期段时间 × 该值 则强制推进
  segment_timeout_factor: 2.0

  # 卡车上表面高度阈值 (m)：铲斗必须高于此值才允许进入下一段
  truck_top_height_m: 2.0

  # 铲斗需超出卡车上表面的裕量 (m)
  bucket_clear_margin_m: 1.8

  # 哪一段完成后触发铲斗高度门控（0=WP1→WP4完成后）
  bucket_clear_seg_idx: 0       # 段0完成后触发门控，确保铲斗高于卡车再进入卸载

  # 门控等待超时 (s)：超时未达标自动追加一小段 boom 提升后重试
  gate_timeout_sec: 4.0

  # 每次自动提升的 boom 角度 (deg)，arm 联动保持铲斗姿态
  gate_boost_boom_deg: 3.0

  # 最大自动提升次数：超过仍不达标则终止卸载（防止无限制提升）
  gate_max_boost_count: 6

  # 航路点限位校验：clamp 修正量超过该值时判定上游航路点不可信，终止激活 (deg)
  waypoint_clamp_abort_deg: 5.0

  # ---- Seg0 两阶段策略参数 ----
  # boom 阶跃中点比例：midpoint = WP1.boom + ratio * (WP4.boom - WP1.boom)
  # 调小(如 0.35) → Phase1 举升行程更短、更早进入 Phase2 的 arm 外伸
  seg0_midpoint_ratio: 0.5
  # boom 到达中点 ±阈值(deg) 后切换到 PCHIP 过渡；调大(如 5) → 小行程工况更稳
  seg0_switch_threshold_deg: 3.0
  # Phase1 复合回转指令速率(deg/s)：boom 阶跃举升期间 swing 向 WP4 回转的速率。
  # 独立于 waypoint/wp4_vel_swing_dps，可单独调"边升边转"快慢（实际受泵流量限制会滞后）
  seg0_phase1_swing_dps: 15.0
  # 小行程退化因子：阶跃行程 < 该值 × seg0_switch_threshold_deg 时，Seg0 退化为单段 PCHIP
  seg0_min_step_factor: 2.0
  # swing Phase1 阶跃偏移角(deg)：Phase1 swing 阶跃目标 = WP4.swing − 该偏移（沿回转方向）
  # swing 到达此"卡车附近"角度后检查高度门控，通过则 Phase2 PCHIP 平滑收尾到 WP4
  # 调大→Phase1 行程长(更多满功率回转)、Phase2 收尾短；调小→反之
  seg0_swing_offset_deg: 15.0
  # 铲斗姿态角目标（boom+arm+bucket，有符号 deg）：Phase1 每帧按实测 boom/arm 反馈
  # 计算参考 bucket 维持该姿态；当前姿态角 >= 该值时才回调收斗（单向，不反向张斗）
  bucket_attitude_target_deg: -180.0

  # ---- 动态卸载点选取 ----
  # 是否启用动态卸载点选取：true 且收到远点（/truck_center_unloadpoint_2）时，
  # 在近点与远点之间生成候选点，按斗数选取；否则回退单点模式（近点即卸载点）
  unload_selector_enable: true
  # 候选点数量：近点到远点之间线性插值，由远及近排列
  unload_candidates_count: 21
  # 前 N 斗选最远可达点
  unload_bucket_far_count: 3
  # 接下来 N 斗选中间可达点
  unload_bucket_mid_count: 3
  # 最后 N 斗选最近可达点；超出 far+mid+near 总斗数默认选中间
  unload_bucket_near_count: 2
