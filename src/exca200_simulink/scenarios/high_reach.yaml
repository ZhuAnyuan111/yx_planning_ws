# 远伸场景：卡车远点拉到 9m，考验最大 reach 边界与 boom boost 门控。
# 相对 baseline 仅改 truck.far_x / far_y。

truck:
  near_x: -6.5
  near_y: 1.8
  near_z: 0.0
  far_x: -9.0
  far_y: 2.5
  heading_deg: 20.0

bucket_number: 3.0   # 多斗数触发"最远卸载点"选取分支

gp_dig_joints:
  swing_deg: 180.0
  boom_deg: 20.0
  arm_deg: -30.0
  bucket_deg: -30.0

clean_dig_joints:
  swing_deg: 180.0
  boom_deg: 5.0
  arm_deg: -110.0
  bucket_deg: -110.0

bucket_terrain_z: -1.0

terrain_profile:
  points: []

activations:
  publish_rate_hz: 1.0
  auto_activate: true
  activate_delay_sec: 2.0
  loop_activate: false
  dump_activate_value: 4.0
  reset_activate_value: 1.0
  dig_activate_value: 3.0

perturbations:
  truck_pos_noise_sigma_m: 0.0
  truck_heading_noise_sigma_deg: 0.0
  rtk_bias_deg: 0.0
  bucket_number_jitter: 0
