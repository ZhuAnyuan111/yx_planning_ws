# 复位轨迹规划节点参数
# 所有参数位于节点私有命名空间 /reset_trajectory_node/

# ===== 阶段切换阈值 =====
# 回转已转过多少度后，开始动臂/斗杆/铲斗跟随映射
swing_threshold_deg: 15.0

# ===== 阶段1 回转超时时间（秒）=====
# 超过此时间阶段1仍未达到阈值则异常中止（保持末次指令并置 Position.x=0）
swing_timeout_sec: 15.0

# ===== 全局执行超时时间（秒）=====
# 从触发 reset 开始计时，覆盖阶段1+阶段2，超时则异常中止
total_timeout_sec: 30.0

# ===== 输入新鲜度超时（秒）=====
# 执行期间 /joints_angle 或 /Swing_topic 静默超过此时长视为传感器断流，
# 立即异常中止，避免基于陈旧反馈继续下发指令
input_timeout_sec: 1.0

# ===== 调试日志开关 =====
# true: 开启阶段1/2周期性进度、物理条件各子项、防抖滤波触发等详细调试打印
# false: 仅保留关键状态切换日志（默认）
enable_debug_log: false

# ===== 物理提前结束判定 =====
# truck_safe 判定阈值：当前回转与卡车中心航向的最短角距超过此值时，
# 视为铲斗已安全脱离卡车（度）
truck_safe_margin_deg: 20.0

# RSThreshold(5)：bucket_height_gd（铲斗相对地面高度）结束阈值
rs_threshold_5: 0.0
