# 复位轨迹规划节点参数
# 所有参数位于节点私有命名空间 /reset_trajectory_node/

# ===== 阶段切换阈值 =====
# 回转已转过多少度后，开始动臂/斗杆/铲斗跟随映射
swing_threshold_deg: 15.0

# ===== 阶段1 回转超时时间（秒）=====
# 超过此时间阶段1仍未达到阈值则异常中止（保持末次指令并置 Position.x=0）
swing_timeout_sec: 15.0

# ===== 全局执行超时时间（秒）=====
# 从触发 reset 开始计时，覆盖阶段1+阶段2，超时则异常中止
total_timeout_sec: 30.0

# ===== 输入新鲜度超时（秒）=====
# 执行期间 /joints_angle 或 /Swing_topic 静默超过此时长视为传感器断流，
# 立即异常中止，避免基于陈旧反馈继续下发指令
input_timeout_sec: 1.0

# ===== 调试日志开关 =====
# true: 开启阶段1/2周期性进度、物理条件各子项、防抖滤波触发等详细调试打印
# false: 仅保留关键状态切换日志（默认）
enable_debug_log: false

# ===== 物理提前结束判定 =====
# truck_safe 判定阈值：当前回转与卡车中心航向的最短角距超过此值时，
# 视为铲斗已安全脱离卡车（度）
truck_safe_margin_deg: 20.0

# RSThreshold(5)：bucket_height_gd（铲斗相对地面高度）结束阈值
rs_threshold_5: 0.0

# ===== 复位目标姿态（部分关节由配置覆盖话题值）=====
# swing / boom 目标角仍取自当前模式话题（/GP_dig_joints 或 /clean_digPoint）。
# arm 目标角不取话题，固定为下方「外翻最大角」；bucket 不取话题，按姿态角保持逐帧解算。

# arm 外翻最大角（deg，有符号）：复位时斗杆外伸到位的目标角。
# 约定与 kinematics 一致——arm 关节范围 [-150, -30]，朝 -30 方向为外翻（外伸）最大。
arm_deploy_max_deg: -30.0

# bucket 姿态角目标（deg，有符号）：姿态角 = boom + arm + bucket。
# 每帧按 bucket = 该值 - boom指令 - arm指令 解算，随 boom/arm 联动维持固定姿态。
bucket_attitude_target_deg: -90.0

# bucket 指令限位（deg）：姿态保持解算后裁剪，防止极端 boom/arm 组合解出超限铲斗角。
bucket_limit_lower_deg: -135.0
bucket_limit_upper_deg: 30.0
